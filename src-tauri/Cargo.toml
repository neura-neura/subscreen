[package]
name = "subscreen"
version = "0.3.4"
description = "Desktop studio for extracting burned-in subtitles"
authors = ["Neura"]
edition = "2021"

[lib]
name = "subscreen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tauri-plugin-libmpv = "0.3.2"
tauri = { version = "2.11.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-updater = "2.12.0"
tauri-plugin-opener = "2.5.5"
